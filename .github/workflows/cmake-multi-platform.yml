name: Build application

# Started by hand, from the Actions tab or the API. Every job produces one
# self-contained application for its target: SDL2, GLEW and the C++ runtime are
# built into the executable, so what comes out of here runs on a machine with
# nothing installed on it.
on:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake \
            libglew-dev libgl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxinerama-dev libxss-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols \
            libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libibus-1.0-dev

      # The makeheaders that comes with the repository is an x86-64 binary, so
      # it is built from source instead of run as it is. tools/makeheaders2-src
      # is the copy that binary was built from, and gives back byte-identical
      # headers; the older tools/makeheaders-src only fills in headers that are
      # already there, and leaves a fresh checkout with broken ones.
      - name: Build makeheaders
        run: c++ -O2 -std=c++17 -o tools/makeheaders tools/makeheaders2-src/makeheaders.cpp

      - name: Build SDL2 as a static library
        env:
          SDL2_VERSION: "2.30.11"
        run: |
          # -f so an HTTP error stops here with something readable, rather than
          # leaving an error page in the file for tar to choke on.
          curl -fsSLo SDL2.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-${SDL2_VERSION}.tar.gz"
          tar xzf SDL2.tar.gz
          cmake -S "SDL2-${SDL2_VERSION}" -B sdl2-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_STATIC_PIC=ON -DSDL_TEST=OFF \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/sdl2"
          cmake --build sdl2-build --parallel --target install

          # SDL2 quietly builds without a video driver when the development
          # headers for one are missing, and the first anyone would hear of it
          # is a window that never opens. It is worth failing here instead.
          if ! grep -q "define SDL_VIDEO_DRIVER_X11 1" "${GITHUB_WORKSPACE}/sdl2/include/SDL2/SDL_config.h"; then
            echo "SDL2 was built without X11 video support"
            exit 1
          fi

      - name: Configure
        run: |
          libdir="/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_SDL2_CONFIG=ON \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/sdl2" \
            -DGLEW_LIBRARY="${libdir}/libGLEW.a" \
            -DGLEW_INCLUDE_DIR=/usr/include \
            -DCMAKE_DISABLE_FIND_PACKAGE_PNG=ON \
            -DUSE_OPEN_ASSET_IMPORT_LIBRARY=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        run: |
          mkdir -p dist
          cp build/HatchGameEngine-Release dist/HatchGameEngine
          strip dist/HatchGameEngine || true
          chmod +x dist/HatchGameEngine

          echo "What the executable still needs from the system:"
          ldd dist/HatchGameEngine || true

          # An artifact is delivered as a zip, and a zip does not carry the
          # executable bit, so the binary travels inside a tarball instead.
          tar -czf "HatchGameEngine-linux-${{ matrix.arch }}.tar.gz" -C dist HatchGameEngine

      - uses: actions/upload-artifact@v4
        with:
          name: HatchGameEngine-linux-${{ matrix.arch }}
          path: HatchGameEngine-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  macos:
    name: macOS (universal)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Build makeheaders
        run: c++ -O2 -std=c++17 -o tools/makeheaders tools/makeheaders2-src/makeheaders.cpp

      # Both architectures in the one library, so the one application covers
      # Apple silicon and Intel Macs alike.
      - name: Build SDL2 as a static universal library
        env:
          SDL2_VERSION: "2.30.11"
        run: |
          curl -fsSLo SDL2.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-${SDL2_VERSION}.tar.gz"
          tar xzf SDL2.tar.gz
          cmake -S "SDL2-${SDL2_VERSION}" -B sdl2-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST=OFF \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/sdl2"
          cmake --build sdl2-build --parallel --target install

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_SDL2_CONFIG=ON \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/sdl2" \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_DISABLE_FIND_PACKAGE_PNG=ON \
            -DUSE_OPEN_ASSET_IMPORT_LIBRARY=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Assemble the application bundle
        run: |
          app="dist/HatchGameEngine.app"
          mkdir -p "${app}/Contents/MacOS" "${app}/Contents/Resources"

          cp build/HatchGameEngine-Release "${app}/Contents/MacOS/HatchGameEngine"
          cp meta/mac/icon.icns "${app}/Contents/Resources/icon.icns"

          cat > "${app}/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>Hatch Game Engine</string>
              <key>CFBundleDisplayName</key>
              <string>Hatch Game Engine</string>
              <key>CFBundleExecutable</key>
              <string>HatchGameEngine</string>
              <key>CFBundleIdentifier</key>
              <string>com.hatchgameengine.HatchGameEngine</string>
              <key>CFBundleIconFile</key>
              <string>icon</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.2.2</string>
              <key>CFBundleVersion</key>
              <string>1.2.2</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST

          # Signed with an ad-hoc signature, which is what Apple silicon insists
          # on before it will run anything at all.
          codesign --force --sign - "${app}"

          echo "Architectures in the executable:"
          lipo -archs "${app}/Contents/MacOS/HatchGameEngine"
          echo "What the executable still needs from the system:"
          otool -L "${app}/Contents/MacOS/HatchGameEngine"

          # An artifact is delivered as a zip, which would drop the executable
          # bit and the signature along with it, so the bundle travels inside a
          # tarball instead.
          tar -czf HatchGameEngine-macos-universal.tar.gz -C dist HatchGameEngine.app

      - uses: actions/upload-artifact@v4
        with:
          name: HatchGameEngine-macos-universal
          path: HatchGameEngine-macos-universal.tar.gz
          if-no-files-found: error

  windows:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: x64
          - arch: arm64
            platform: ARM64

    steps:
      - uses: actions/checkout@v4

      # Everything here is built against the static C runtime, so the finished
      # executable does not ask for a Visual C++ redistributable either.
      - name: Build SDL2 as a static library
        shell: pwsh
        env:
          SDL2_VERSION: "2.30.11"
        run: |
          # Braces around the name, or PowerShell reads "$env:SDL2_VERSION.zip"
          # as an environment variable called SDL2_VERSION.zip and hands back
          # nothing at all.
          curl.exe -fsSLo SDL2.zip "https://github.com/libsdl-org/SDL/releases/download/release-${env:SDL2_VERSION}/SDL2-${env:SDL2_VERSION}.zip"
          tar -xf SDL2.zip
          cmake -S "SDL2-${env:SDL2_VERSION}" -B sdl2-build -A ${{ matrix.platform }} `
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST=OFF `
            -DSDL_FORCE_STATIC_VCRT=ON `
            -DCMAKE_INSTALL_PREFIX="${env:GITHUB_WORKSPACE}/sdl2"
          cmake --build sdl2-build --config Release --parallel --target install

      - name: Build GLEW as a static library
        shell: pwsh
        env:
          GLEW_VERSION: "2.2.0"
        run: |
          curl.exe -fsSLo glew.zip "https://github.com/nigels-com/glew/releases/download/glew-${env:GLEW_VERSION}/glew-${env:GLEW_VERSION}.zip"
          tar -xf glew.zip
          cmake -S "glew-${env:GLEW_VERSION}/build/cmake" -B glew-build -A ${{ matrix.platform }} `
            -DBUILD_UTILS=OFF `
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 `
            -DCMAKE_C_FLAGS_RELEASE="/MT /O2 /Ob2 /DNDEBUG"
          cmake --build glew-build --config Release --parallel --target glew_s

          $glew = Get-ChildItem -Path glew-build -Recurse -Filter "libglew*.lib" | Select-Object -First 1
          if (-not $glew) { throw "GLEW did not produce a static library" }

          "GLEW_LIB=$($glew.FullName)" | Out-File -FilePath ${env:GITHUB_ENV} -Append -Encoding utf8
          "GLEW_INC=${env:GITHUB_WORKSPACE}/glew-${env:GLEW_VERSION}/include" | Out-File -FilePath ${env:GITHUB_ENV} -Append -Encoding utf8

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -A ${{ matrix.platform }} `
            -DCMAKE_BUILD_TYPE=Release `
            -DUSE_SDL2_CONFIG=ON `
            -DCMAKE_PREFIX_PATH="${env:GITHUB_WORKSPACE}/sdl2" `
            -DGLEW_LIBRARY="${env:GLEW_LIB}" `
            -DGLEW_INCLUDE_DIR="${env:GLEW_INC}" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DUSE_OPEN_ASSET_IMPORT_LIBRARY=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/HatchGameEngine-Release.exe dist/HatchGameEngine.exe

      - uses: actions/upload-artifact@v4
        with:
          name: HatchGameEngine-windows-${{ matrix.arch }}
          path: dist/HatchGameEngine.exe
          if-no-files-found: error

  xbox:
    # 24.04 rather than the 22.04 the other Linux jobs use: nxdk tests itself
    # against the clang of the current Ubuntu, and 22.04's clang 14 is behind
    # what it expects.
    name: Xbox (original)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # nxdk is the open-source Xbox toolchain. It builds with clang and lld
      # targeting i386, so nothing here comes from Microsoft's SDK.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang lld llvm pkgconf bison flex

      - name: Build makeheaders
        run: c++ -O2 -std=c++17 -o tools/makeheaders tools/makeheaders2-src/makeheaders.cpp

      - name: Check out nxdk
        run: |
          git clone --recursive --depth 1 https://github.com/XboxDev/nxdk.git "${GITHUB_WORKSPACE}/nxdk"

      # NXDK_ONLY builds nxdk's libraries without building a title alongside
      # them, which is exactly what a project bringing its own build system
      # wants. It produces the C++ runtime, SDL2, libpng and zlib the engine
      # links against.
      - name: Build the nxdk libraries
        run: |
          export NXDK_DIR="${GITHUB_WORKSPACE}/nxdk"
          export PATH="${NXDK_DIR}/bin:${PATH}"
          make -C "${NXDK_DIR}" NXDK_ONLY=1 --jobs $(nproc)

          for lib in libc++ libSDL2 libpng libzlib libpdclib; do
            if [ ! -f "${NXDK_DIR}/lib/${lib}.lib" ]; then
              echo "nxdk did not produce ${lib}.lib"
              exit 1
            fi
          done

      - name: Configure
        run: |
          export NXDK_DIR="${GITHUB_WORKSPACE}/nxdk"
          export PATH="${NXDK_DIR}/bin:${PATH}"
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="${NXDK_DIR}/share/toolchain-nxdk.cmake" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          export NXDK_DIR="${GITHUB_WORKSPACE}/nxdk"
          export PATH="${NXDK_DIR}/bin:${PATH}"
          cmake --build build --parallel

      - name: Package
        run: |
          # A title boots from a file called default.xbe, so what comes out of
          # here is dropped straight onto a disc image or a hard drive folder.
          if [ "$(head -c 4 build/default.xbe)" != "XBEH" ]; then
            echo "build/default.xbe is not an XBE"
            exit 1
          fi

          mkdir -p dist
          cp build/default.xbe dist/default.xbe

          tar -czf HatchGameEngine-xbox.tar.gz -C dist default.xbe

      - uses: actions/upload-artifact@v4
        with:
          name: HatchGameEngine-xbox
          path: HatchGameEngine-xbox.tar.gz
          if-no-files-found: error

  web:
    name: WebAssembly (WebGL)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake

      - name: Build makeheaders
        run: c++ -O2 -std=c++17 -o tools/makeheaders tools/makeheaders2-src/makeheaders.cpp

      # Pinned rather than tracking latest, the same way SDL2 and GLEW are
      # above: a toolchain that changes underneath the build is a build that
      # breaks without anything in the repository having changed.
      - name: Install the Emscripten SDK
        env:
          EMSDK_VERSION: "6.0.8"
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "${GITHUB_WORKSPACE}/emsdk"
          "${GITHUB_WORKSPACE}/emsdk/emsdk" install "${EMSDK_VERSION}"
          "${GITHUB_WORKSPACE}/emsdk/emsdk" activate "${EMSDK_VERSION}"

      - name: Configure
        run: |
          . "${GITHUB_WORKSPACE}/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      # SDL2, libpng and zlib are built here as Emscripten ports, downloaded and
      # cached by the toolchain rather than fetched by this workflow.
      - name: Build
        run: |
          . "${GITHUB_WORKSPACE}/emsdk/emsdk_env.sh"
          cmake --build build --parallel

      - name: Package
        run: |
          mkdir -p dist

          # The page is only useful with all three: the loader is what fetches
          # the wasm, and the html is what hosts the canvas.
          for part in html js wasm; do
            file="build/HatchGameEngine-Release.${part}"
            if [ ! -s "${file}" ]; then
              echo "the build did not produce ${file}"
              exit 1
            fi
            cp "${file}" "dist/index.${part}"
          done

          # index.html is what a static host serves for a bare URL, and the
          # loader is named inside it, so that reference is renamed to match.
          sed -i 's/HatchGameEngine-Release\.js/index.js/g' dist/index.html
          sed -i 's/HatchGameEngine-Release\.wasm/index.wasm/g' dist/index.js

          echo "What the page is made of:"
          ls -l dist

          tar -czf HatchGameEngine-web.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: HatchGameEngine-web
          path: HatchGameEngine-web.tar.gz
          if-no-files-found: error

  megadrive:
    # Not a build of the engine -- it does not run on a Mega Drive and cannot be
    # made to. This checks the other direction: that the exporter still turns a
    # scene into a project SGDK compiles into a ROM that boots.
    name: Mega Drive (export)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # m68k-linux-gnu is a Linux-targeted cross compiler rather than the
      # m68k-elf one SGDK expects, but the instruction set is the same and
      # nothing here uses the parts that differ -- the ROM is linked freestanding
      # against SGDK's own script.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake default-jre-headless \
            gcc-m68k-linux-gnu binutils-m68k-linux-gnu \
            xvfb libglew-dev libgl1-mesa-dev libsdl2-dev

      - name: Build makeheaders
        run: c++ -O2 -std=c++17 -o tools/makeheaders tools/makeheaders2-src/makeheaders.cpp

      - name: Build the engine
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUSE_OPEN_ASSET_IMPORT_LIBRARY=OFF
          cmake --build build --parallel

      - name: Check out SGDK
        run: git clone --depth 1 https://github.com/Stephane-D/SGDK.git "${GITHUB_WORKSPACE}/sgdk"

      # SGDK ships these as Windows binaries and builds them from source
      # everywhere else. Its library needs them before it will build.
      - name: Build SGDK
        run: |
          sgdk="${GITHUB_WORKSPACE}/sgdk"
          mkdir -p "${GITHUB_WORKSPACE}/mdbin"

          for tool in sjasm bintos; do
            cmake -S "${sgdk}/tools/${tool}" -B "build-${tool}" \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
            cmake --build "build-${tool}" --parallel
            find "build-${tool}" -maxdepth 2 -type f -executable -name "${tool}*" \
              -exec cp {} "${GITHUB_WORKSPACE}/mdbin/" \;
          done

          make -C "${sgdk}/tools/convsym" --jobs $(nproc)
          find "${sgdk}/tools/convsym" -name convsym -type f -executable \
            -exec cp {} "${GITHUB_WORKSPACE}/mdbin/" \;

          PATH="${GITHUB_WORKSPACE}/mdbin:${PATH}" \
            make -C "${sgdk}" -f makelib.gen release PREFIX=m68k-linux-gnu- GDK=.

      - name: Export the sample scenes
        run: |
          # The engine creates its textures through a renderer, so it wants a
          # display even when all it is being asked for is a conversion.
          #
          # Both scenes, not just one. sample.tmx is 32 columns across and
          # wide.tmx is 40, and a layer's rows are stored as far apart as the
          # next power of two above its width -- so only the second of them
          # catches a converter that walks the layer by its width instead.
          for scene in sample wide; do
            xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 \
              ./build/HatchGameEngine-Release \
                --project-dir meta/megadrive/sample \
                --scene "Scenes/${scene}.tmx" \
                --export-megadrive "${GITHUB_WORKSPACE}/mdexport-${scene}"
          done

          for part in res/tiles.bin res/map.bin res/palette.bin res/resources.res src/main.c Makefile; do
            if [ ! -s "${GITHUB_WORKSPACE}/mdexport-sample/${part}" ]; then
              echo "the exporter did not write ${part}"
              exit 1
            fi
          done

          ln -s "${GITHUB_WORKSPACE}/mdexport-sample" "${GITHUB_WORKSPACE}/mdexport"

      # Reads the export back and rebuilds the picture from it, then compares
      # that against the tileset and map it came from. Checking that a ROM
      # builds only says the bytes are well formed; this says they are right.
      - name: Check the export against the art it was made from
        run: |
          for scene in sample wide; do
            python3 tools/verify-sega-export.py megadrive \
              "${GITHUB_WORKSPACE}/mdexport-${scene}" \
              meta/megadrive/sample/Resources/Scenes \
              "${scene}.tmx"
          done

      - name: Build the ROM
        run: |
          cd "${GITHUB_WORKSPACE}/mdexport"

          # Ubuntu's gcc adds a build-id note that lands on top of the ROM's
          # own vectors in SGDK's linker script. The m68k-elf toolchain SGDK
          # normally uses does not, so this is only needed here.
          PATH="${GITHUB_WORKSPACE}/mdbin:${PATH}" GDK="${GITHUB_WORKSPACE}/sgdk" \
            make -f "${GITHUB_WORKSPACE}/sgdk/makefile.gen" \
              PREFIX=m68k-linux-gnu- \
              CC='m68k-linux-gnu-gcc -Wl,--build-id=none'

          rom=out/rom.bin
          if [ ! -s "${rom}" ]; then
            echo "no ROM was produced"
            exit 1
          fi

          # A cartridge names the console at 0x100. If that is not there, what
          # came out is not something a Mega Drive would run.
          if ! dd if="${rom}" bs=1 skip=256 count=16 2>/dev/null | grep -q "SEGA"; then
            echo "the ROM has no SEGA signature at 0x100"
            exit 1
          fi

          echo "ROM: $(stat -c%s "${rom}") bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: HatchGameEngine-megadrive-sample-rom
          path: mdexport/out/rom.bin
          if-no-files-found: error

  megacd:
    # Not a build of the engine either. The Mega CD adds a second 68000, half a
    # megabyte of RAM and a disc drive to a Mega Drive, which still leaves it
    # about twenty megabytes short. This checks the export: that a scene turns
    # into a project Megadev builds into a disc image.
    name: Mega CD (export)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # Megadev asks for the m68k cross compiler by its Linux-targeted name,
      # which is the one the distribution packages, and for mkisofs, which is
      # what genisoimage installs itself as on some releases and not others.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake xvfb \
            gcc-m68k-linux-gnu binutils-m68k-linux-gnu genisoimage \
            libglew-dev libgl1-mesa-dev libsdl2-dev

          command -v mkisofs >/dev/null || \
            sudo ln -s "$(command -v genisoimage)" /usr/local/bin/mkisofs

      - name: Build makeheaders
        run: c++ -O2 -std=c++17 -o tools/makeheaders tools/makeheaders2-src/makeheaders.cpp

      - name: Build the engine
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUSE_OPEN_ASSET_IMPORT_LIBRARY=OFF
          cmake --build build --parallel

      - name: Check out Megadev
        run: git clone --depth 1 https://github.com/drojaazu/megadev.git "${GITHUB_WORKSPACE}/megadev"

      - name: Export the sample scene
        run: |
          # The engine makes its textures through a renderer, so it wants a
          # display even when all it is being asked for is a conversion.
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 \
            ./build/HatchGameEngine-Release \
              --project-dir meta/megadrive/sample \
              --scene Scenes/sample.tmx \
              --export-megacd "${GITHUB_WORKSPACE}/mcdexport"

      - name: Build the disc image
        run: |
          cd "${GITHUB_WORKSPACE}/mcdexport"
          make MEGADEV_PATH="${GITHUB_WORKSPACE}/megadev"

          iso=hatch.iso
          if [ ! -s "${iso}" ]; then
            echo "no disc image was produced"
            exit 1
          fi

          # A Mega CD disc names the system in its first sector. Without that
          # the BIOS will not look at it, whatever else is on the disc.
          if [ "$(dd if="${iso}" bs=1 count=14 2>/dev/null)" != "SEGADISCSYSTEM" ]; then
            echo "the image does not begin with SEGADISCSYSTEM"
            exit 1
          fi

          # And the art has to have actually reached the filesystem.
          if ! grep -qa "HATCH.BIN" "${iso}"; then
            echo "the art file is not in the disc filesystem"
            exit 1
          fi

          echo "disc image: $(stat -c%s "${iso}") bytes"

      # The art on the disc is the same conversion the cartridge export uses, so
      # it should come out byte for byte identical. If it ever does not, one of
      # the two has drifted.
      - name: Check the disc carries what the cartridge does
        run: |
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 \
            ./build/HatchGameEngine-Release \
              --project-dir meta/megadrive/sample \
              --scene Scenes/sample.tmx \
              --export-megadrive "${GITHUB_WORKSPACE}/mdexport"

          cat "${GITHUB_WORKSPACE}/mdexport/res/palette.bin" \
              "${GITHUB_WORKSPACE}/mdexport/res/tiles.bin" \
              "${GITHUB_WORKSPACE}/mdexport/res/map.bin" > /tmp/cartridge.bin

          if ! cmp /tmp/cartridge.bin "${GITHUB_WORKSPACE}/mcdexport/disc/hatch.bin"; then
            echo "the disc and the cartridge no longer carry the same art"
            exit 1
          fi

          echo "disc and cartridge art are identical"

      - uses: actions/upload-artifact@v4
        with:
          name: HatchGameEngine-megacd-sample-iso
          path: mcdexport/hatch.iso
          if-no-files-found: error

  sega32x:
    # Not a build of the engine: the 32X's SH-2s have 256 KB between them. This
    # checks the export -- that a scene turns into a project which builds into a
    # ROM the console would boot.
    name: 32X (export)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake xvfb texinfo \
            gcc-m68k-linux-gnu binutils-m68k-linux-gnu \
            libglew-dev libgl1-mesa-dev libsdl2-dev

      # Nothing packages a bare-metal SH-2 compiler. The distribution's SH
      # toolchain is configured for a little-endian SH-4 and refuses -m2, so the
      # one thing that will build a 32X ROM has to be built. It only depends on
      # its own version, so it is cached rather than rebuilt every run.
      - name: Cache the SH-2 toolchain
        id: sh2cache
        uses: actions/cache@v4
        with:
          path: ~/sh2
          key: sh2-elf-binutils-2.42-gcc-13.2.0-${{ runner.os }}

      - name: Build the SH-2 toolchain
        if: steps.sh2cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          prefix="${HOME}/sh2"
          work="${RUNNER_TEMP}/sh2src"
          mkdir -p "${work}" && cd "${work}"

          curl -fsSLO https://ftp.gnu.org/gnu/binutils/binutils-2.42.tar.xz
          curl -fsSLO https://ftp.gnu.org/gnu/gcc/gcc-13.2.0/gcc-13.2.0.tar.xz
          tar xf binutils-2.42.tar.xz
          tar xf gcc-13.2.0.tar.xz

          # MAKEINFO=true: the documentation needs texinfo and is of no use to a
          # build that only ever runs the compiler.
          mkdir build-binutils && cd build-binutils
          ../binutils-2.42/configure --target=sh-elf --prefix="${prefix}" \
            --disable-nls --disable-werror --with-sysroot MAKEINFO=true
          make -j"$(nproc)" MAKEINFO=true
          make install MAKEINFO=true
          cd ..

          export PATH="${prefix}/bin:${PATH}"

          cd gcc-13.2.0 && ./contrib/download_prerequisites && cd ..

          # Freestanding, so there are no libc headers to point at and nothing
          # to build beyond the compiler and libgcc.
          mkdir build-gcc && cd build-gcc
          ../gcc-13.2.0/configure --target=sh-elf --prefix="${prefix}" \
            --disable-nls --enable-languages=c --without-headers \
            --disable-libssp --disable-libquadmath --disable-threads \
            --disable-libgomp --disable-libatomic --disable-shared \
            --with-multilib-list=m2
          make -j"$(nproc)" all-gcc
          make install-gcc
          make -j"$(nproc)" all-target-libgcc
          make install-target-libgcc

      - name: Check the toolchain targets the right machine
        run: |
          export PATH="${HOME}/sh2/bin:${PATH}"
          printf 'int f(int a,int b){return a*b+7;}\n' > /tmp/sh.c
          sh-elf-gcc -m2 -mb -ffreestanding -nostdlib -O2 -c /tmp/sh.c -o /tmp/sh.o

          # An SH-2 ROM that came out little-endian would build and never run.
          if ! sh-elf-readelf -h /tmp/sh.o | grep -q "big endian"; then
            echo "the toolchain is not producing big-endian objects"
            exit 1
          fi

      - name: Build makeheaders
        run: c++ -O2 -std=c++17 -o tools/makeheaders tools/makeheaders2-src/makeheaders.cpp

      - name: Build the engine
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUSE_OPEN_ASSET_IMPORT_LIBRARY=OFF
          cmake --build build --parallel

      - name: Export the sample scene
        run: |
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 \
            ./build/HatchGameEngine-Release \
              --project-dir meta/megadrive/sample \
              --scene Scenes/sample.tmx \
              --32x-runtime "${GITHUB_WORKSPACE}/meta/32x/runtime" \
              --export-32x "${GITHUB_WORKSPACE}/x32export"

      - name: Build the ROM
        run: |
          export PATH="${HOME}/sh2/bin:${PATH}"
          cd "${GITHUB_WORKSPACE}/x32export"

          make SHBIN= MDBIN= SHPREFIX=sh-elf- MDPREFIX=m68k-linux-gnu-

          rom=out/rom.32x
          if [ ! -s "${rom}" ]; then
            echo "no ROM was produced"
            exit 1
          fi

          # A 32X cartridge says so at 0x100, and the console checks.
          if [ "$(dd if="${rom}" bs=1 skip=256 count=8 2>/dev/null)" != "SEGA 32X" ]; then
            echo "the ROM does not identify itself as a 32X cartridge"
            exit 1
          fi

          # And the header should carry the scene's name rather than whatever
          # the runtime it was built from was called.
          title=$(dd if="${rom}" bs=1 skip=288 count=48 2>/dev/null)
          case "${title}" in
            SAMPLE*) ;;
            *) echo "the header title is \"${title}\", not the scene's"; exit 1 ;;
          esac

          echo "ROM: $(stat -c%s "${rom}") bytes, title \"${title}\""

      - uses: actions/upload-artifact@v4
        with:
          name: HatchGameEngine-32x-sample-rom
          path: x32export/out/rom.32x
          if-no-files-found: error

  gamegear:
    # Not a build of the engine: a Z80 with 8 KB of work RAM. This checks the
    # export -- that a scene turns into a project SDCC builds into a cartridge.
    name: Game Gear (export)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake xvfb sdcc sdcc-libraries \
            libglew-dev libgl1-mesa-dev libsdl2-dev

      - name: Build makeheaders
        run: c++ -O2 -std=c++17 -o tools/makeheaders tools/makeheaders2-src/makeheaders.cpp

      - name: Build the engine
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUSE_OPEN_ASSET_IMPORT_LIBRARY=OFF
          cmake --build build --parallel

      # devkitSMS ships its library, its startup code and its ihx2sms converter
      # prebuilt, and those binaries do not necessarily match the SDCC in front
      # of them. They are built from the sources beside them instead. This is
      # not belt and braces: with the shipped ihx2sms the cartridge came out
      # with tile data where its reset vector belongs and ran as a black screen.
      - name: Check out and build devkitSMS
        run: |
          git clone --depth 1 https://github.com/sverx/devkitSMS.git "${GITHUB_WORKSPACE}/devkitSMS"
          dk="${GITHUB_WORKSPACE}/devkitSMS"

          make -C "${dk}/crt0/src"
          make -C "${dk}/SMSlib/src"
          cc -O2 -o "${GITHUB_WORKSPACE}/ihx2sms" "${dk}/ihx2sms/src/ihx2sms.c"

      - name: Export the sample scene
        run: |
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 \
            ./build/HatchGameEngine-Release \
              --project-dir meta/megadrive/sample \
              --scene Scenes/sample.tmx \
              --export-gamegear "${GITHUB_WORKSPACE}/ggexport"

      # Reads the export back and rebuilds the picture from it -- bitplanes,
      # twelve-bit colour words and all -- then compares that against the
      # tileset and map it came from.
      - name: Check the export against the art it was made from
        run: |
          python3 tools/verify-sega-export.py gamegear \
            "${GITHUB_WORKSPACE}/ggexport" \
            meta/megadrive/sample/Resources/Scenes \
            sample.tmx

      - name: Build the cartridge
        run: |
          dk="${GITHUB_WORKSPACE}/devkitSMS"
          cd "${GITHUB_WORKSPACE}/ggexport"

          make DEVKITSMS="${dk}" \
               SMSLIB_LIB="${dk}/SMSlib/src/SMSlib_GG.lib" \
               CRT0="${dk}/crt0/src/crt0_sms.rel" \
               IHX2SMS="${GITHUB_WORKSPACE}/ihx2sms"

          rom=out/rom.gg
          if [ ! -s "${rom}" ]; then
            echo "no cartridge was produced"
            exit 1
          fi

          # A Z80 starts at address 0 with interrupts disabled. F3 is DI, and if
          # it is not the first byte then whatever is there is not the program --
          # which is exactly how the broken converter showed up.
          first=$(dd if="${rom}" bs=1 count=1 2>/dev/null | od -An -tx1 | tr -d ' ')
          if [ "${first}" != "f3" ]; then
            echo "the cartridge does not begin with DI -- got 0x${first}"
            exit 1
          fi

          echo "cartridge: $(stat -c%s "${rom}") bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: HatchGameEngine-gamegear-sample-rom
          path: ggexport/out/rom.gg
          if-no-files-found: error
